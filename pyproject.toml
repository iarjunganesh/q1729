[project]
name = "q1729"
version = "0.3.0"
description = "Ramanujan's mathematics meets GPU quantum simulation — a hand-written CUDA kernel vs CUDA-Q amplitude estimation, measured on the same silicon"
# One interpreter line everywhere (Windows, WSL2, CI): 3.14 is the newest Python
# that CUDA-Q publishes Linux wheels for (cuda-quantum-cu13 0.16.0.post1).
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Arjun Ganesh", email = "iarjunganesh@gmail.com" }]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.ruff.lint.isort]
known-first-party = ["analysis", "classical", "quantum", "tests"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
source = ["classical", "quantum", "analysis", "benchmarks", "scripts"]

[tool.coverage.report]
show_missing = true
# exclude_lines replaces the defaults, so the pragma regex must be restated
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
