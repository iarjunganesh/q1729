name: Benchmark Submission
description: Share a benchmark run from your own hardware
title: "[benchmark] "
labels: ["benchmark"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for running q1729 on your own hardware! A run file carries its own
        provenance — `hardware_id`, `environment.gpu`, `execution` (selected device,
        target and precision), `provenance` (source revision) and the committed
        `protocol` — so submissions from any GPU can be read on their own terms.
        A run from different hardware is a separate observation, not a point on one
        shared crossover axis; comparisons need matched controls.

        Schema and validation rules: [docs/run-file.md](https://github.com/iarjunganesh/q1729/blob/main/docs/run-file.md).
        Validate before submitting: `python -m benchmarks.run_file <your-run>.json`.
        `data/sample_run.json` is a synthetic legacy demo, not a template.

  - type: input
    id: gpu
    attributes:
      label: GPU model + VRAM
      placeholder: e.g. NVIDIA RTX 4090 24GB
    validations:
      required: true

  - type: input
    id: driver-cuda
    attributes:
      label: Driver version + CUDA runtime version
      description: The run file records both under `execution.classical`.
      placeholder: e.g. driver 616.92, CUDA runtime 13020
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: CUDA-Q target actually selected (`execution.quantum.target`)
      options:
        - nvidia
        - nvidia-mgpu
        - tensornet
        - qpp-cpu
        - other (describe in notes)
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: OS / environment
      options:
        - WSL2
        - native Linux
        - cloud (rented instance)
        - other (describe in notes)
    validations:
      required: true

  - type: input
    id: controls
    attributes:
      label: Declared controls
      description: Power profile, time budget, shots and repeats exactly as passed to the harness.
      placeholder: e.g. --power-profile turbo --time-budget-s 3600 --shots 4000 --repeats 5
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: Run status (`status.state`)
      description: Aborted runs are welcome too — they show where a device ran out of budget or failed.
      options:
        - complete
        - aborted
    validations:
      required: true

  - type: textarea
    id: run-file
    attributes:
      label: Run file (JSON)
      description: Paste the run file contents, or drag-and-drop it as an attachment. Review exception text and environment metadata before sharing.
      render: json
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anomalies or notes
      description: Anything unexpected — crashes, memory limits, timing outliers, thermal state, other load on the machine.
    validations:
      required: false
