name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify tag, version, notes and main ancestry
        run: python -m scripts.release_check "$GITHUB_REF_NAME"

  quality:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  release:
    needs: [preflight, quality]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Recheck metadata and extract notes
        run: python -m scripts.release_check "$GITHUB_REF_NAME"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
          generate_release_notes: false
